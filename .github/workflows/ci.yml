name: Verify and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./gateway pytest
      - run: python -m pytest gateway tools -q
      - run: python -m compileall -q gateway/src tools deploy/server native
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Check-Scripts.ps1
      - if: runner.os == 'Linux'
        run: bash -n deploy/server/install.sh
  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - working-directory: extension
        run: npm ci --ignore-scripts
      - working-directory: extension
        run: npm run build
      - working-directory: extension
        run: npm test
      - working-directory: extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: chatbridge-vsix
          path: extension/*.vsix
          if-no-files-found: error
